name: 📊 dashboard

on:
  schedule:
    - cron: "0 */8 * * *"   # every 8 hours — same as nrjdalal
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run github-dashboard
        run: npx github-dashboard@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: sidgaikwad
          # Markers in README.md: <!-- DASHBOARD:START --> ... <!-- DASHBOARD:END -->
          README_PATH: README.md
          START_MARKER: "<!-- DASHBOARD:START -->"
          END_MARKER: "<!-- DASHBOARD:END -->"

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update dashboard [skip ci]"
          git push